name: Build Sepehr APK

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sepehr_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (first time only)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.sepehr --project-name sepehr
            rm -f test/widget_test.dart
          fi

      - name: Add internet + location permissions, Persian app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$M" || perl -0pi -e 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' "$M"
          sed -i 's#android:label="sepehr"#android:label="سپهر"#' "$M"

      - run: flutter pub get

      - name: Run tests
        run: |
          set +e
          flutter test --reporter=json > "$RUNNER_TEMP/flutter-test.jsonl" 2> "$RUNNER_TEMP/flutter-test.stderr"
          test_status=$?
          python3 - "$RUNNER_TEMP/flutter-test.jsonl" <<'PY'
          import json
          import pathlib
          import sys

          report = pathlib.Path(sys.argv[1])
          failures = []
          if report.exists():
              for line in report.read_text(errors="replace").splitlines():
                  try:
                      event = json.loads(line)
                  except json.JSONDecodeError:
                      continue
                  if event.get("type") == "error":
                      details = event.get("error", "Test failed")
                      stack = event.get("stackTrace", "")
                      failures.append(f"{details}\\n{stack}".strip())
          for failure in failures:
              escaped = failure.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Flutter test failure::{escaped}")
          PY
          cat "$RUNNER_TEMP/flutter-test.stderr"
          exit "$test_status"

      - name: Build APK
        run: flutter build apk --release --dart-define=NASA_KEY=${{ secrets.NASA_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: sepehr-apk
          path: sepehr_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release (on version tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sepehr_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
