name: Build Sepehr APK

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sepehr_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (first time only)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.sepehr --project-name sepehr
            rm -f test/widget_test.dart
          fi

      - name: Add internet + location permissions, Persian app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$M" || perl -0pi -e 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' "$M"
          sed -i 's#android:label="sepehr"#android:label="سپهر"#' "$M"

      - run: flutter pub get

      - name: Run tests
        run: |
          set +e
          flutter test --reporter=expanded > "$RUNNER_TEMP/flutter-test.log" 2>&1
          test_status=$?
          cat "$RUNNER_TEMP/flutter-test.log"
          if [ "$test_status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/flutter-test.log" <<'PY'
          import pathlib
          import sys

          lines = [line for line in pathlib.Path(sys.argv[1]).read_text(errors="replace").splitlines() if line.strip()]
          for line in lines[-80:]:
              escaped = line.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Flutter test output::{escaped}")
          PY
          fi
          exit "$test_status"

      - name: Build APK
        run: flutter build apk --release --dart-define=NASA_KEY=${{ secrets.NASA_KEY }}

      - uses: actions/upload-artifact@v4
        with:
          name: sepehr-apk
          path: sepehr_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release (on version tags like v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sepehr_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
