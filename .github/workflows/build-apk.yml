name: Build Sepehr APK

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sepehr_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project (first time only)
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android --org com.sepehr --project-name sepehr
            rm -f test/widget_test.dart
          fi

      - name: Add internet + location permissions, Persian app name
        run: |
          M=android/app/src/main/AndroidManifest.xml
          grep -q "android.permission.INTERNET" "$M" || perl -0pi -e 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' "$M"
          sed -i 's#android:label="sepehr"#android:label="سپهر"#' "$M"

      - run: flutter pub get

      - name: Run tests
        run: |
          set +e
          flutter test --reporter=expanded > "$RUNNER_TEMP/flutter-test.log" 2>&1
          test_status=$?
          cat "$RUNNER_TEMP/flutter-test.log"
          if [ "$test_status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/flutter-test.log" <<'PY'
          import pathlib
          import sys

          raw = pathlib.Path(sys.argv[1]).read_text(errors="replace").replace(chr(13), chr(10))
          lines = []
          for source_line in raw.splitlines():
              line = source_line
              while chr(27) + "[" in line:
                  start = line.find(chr(27) + "[")
                  end = line.find("m", start)
                  if end < 0:
                      break
                  line = line[:start] + line[end + 1:]
              lines.append(line.strip())
          keywords = ("expected:", "actual:", "which:", "exception", "testfailure", "renderflex", "rangeerror", "bad state", "failed", "error:")
          def is_progress(line):
              return len(line) >= 5 and line[:2].isdigit() and line[2] == ":" and line[3:5].isdigit()
          details = [line for line in lines if line and not is_progress(line) and any(word in line.lower() for word in keywords)]
          if not details:
              details = [line for line in lines if line and not is_progress(line)][-8:]
          for line in details[-8:]:
              escaped = line.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")
              print(f"::error title=Flutter test failure::{escaped}")
          PY
          fi
          exit "$test_status"

      - name: Build APK
        run: |
          set +e
          flutter build apk --release --dart-define=NASA_KEY=${{ secrets.NASA_KEY }} > "$RUNNER_TEMP/flutter-build.log" 2>&1
          build_status=$?
          cat "$RUNNER_TEMP/flutter-build.log"
          if [ "$build_status" -ne 0 ]; then
            python3 - "$RUNNER_TEMP/flutter-build.log" <<'PY'
          import pathlib
          import sys

          raw = pathlib.Path(sys.argv[1]).read_text(errors="replace").replace(chr(13), chr(10))
          lines = [line.strip() for line in raw.splitlines() if line.strip()]
          keywords = ("error:", " error ", "failure:", "failed", "exception", "not found", "isn't defined", "is not a subtype", "cannot be assigned", "gradle task")
          details = [line for line in lines if any(word in line.lower() for word in keywords)]
          if not details:
              details = lines[-8:]
          for line in details[-8:]:
              escaped = line.replace("%", "%25").replace(chr(13), "%0D").replace(chr(10), "%0A")
              print(f"::error title=Flutter APK build::{escaped}")
          PY
          fi
          exit "$build_status"

      - uses: actions/upload-artifact@v4
        with:
          name: sepehr-apk
          path: sepehr_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Publish GitHub Release (on version tags like v2.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: sepehr_app/build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
